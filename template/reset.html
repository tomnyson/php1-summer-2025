<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Roboto&display=swap" rel="stylesheet" />
  <link href="shared.css" rel="stylesheet" />
</head>
<body>
  <div class="auth-container">
    <h2>Reset Your Password</h2>
    <form id="resetForm">
      <div class="mb-3">
        <label>New Password</label>
        <input type="password" name="password" class="form-control" required />
      </div>
      <div class="d-grid">
        <button class="btn btn-primary">Reset Password</button>
      </div>
    </form>
    <script>
      const token = new URLSearchParams(window.location.search).get("token");
      document.getElementById("resetForm").onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        const res = await fetch(`/api/reset-password?token=${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        alert(result.message || 'Password reset successfully');
      };
    </script>
  </div>
</body>
</html>
